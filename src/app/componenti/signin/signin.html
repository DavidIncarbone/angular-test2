<h1>Login</h1>
<form #signinform="ngForm" (ngSubmit)="onSubmit(signinform)">
  <mat-form-field>
    <mat-label>Email</mat-label>
    <input matInput type="email" name="email" ngModel required />
  </mat-form-field>
  <mat-form-field class="example-full-width">
    <mat-label>Password</mat-label>
    <input matInput type="password" name="password" ngModel required />
  </mat-form-field>
  <button matButton="outlined" type="submit" [disabled]="!signinform.valid">Invia</button>
</form>
