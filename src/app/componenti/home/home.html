<!-- <form #homeform="ngForm" (ngSubmit)="onSubmit(homeform)"> -->
<form [formGroup]="homeform" (ngSubmit)="onSubmit()">
  <mat-form-field>
    <mat-label>Nome</mat-label>
    <!-- <input matInput name="nome" ngModel required /> -->
    <input matInput name="nome" formControlName="nome" />
  </mat-form-field>
  <p *ngIf="!homeform.get('nome')?.valid && homeform.get('nome')?.touched">Inserisci un nome</p>
  <mat-form-field class="example-full-width">
    <mat-label>Email</mat-label>
    <!-- <input matInput type="email" name="email" ngModel required email /> -->
    <input matInput type="email" name="email" formControlName="email" />
  </mat-form-field>
  <mat-form-field appearance="fill">
    <mat-label>Colore</mat-label>
    <!-- <mat-select name="colore" ngModel> -->
    <mat-select name="colore" formControlName="colore">
      <mat-option value="rosso">Rosso</mat-option>
      <mat-option value="blu">Blu</mat-option>
    </mat-select>
  </mat-form-field>
  <button matButton="outlined" type="submit" [disabled]="!homeform.valid">Invia</button>
</form>
